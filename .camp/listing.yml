name: tiny_sheetmusic
summary: 'A TinyMCE plugin for Moodle that lets teachers and students write, edit, import and export sheet music in the text editor.'
description: |
  Adds a toolbar button and Insert menu item that open a score editor with
  point-and-click and keyboard note entry plus an ABC source tab with live
  preview. Scores can be imported from ABC, MusicXML and MIDI (with the MIDI
  guess shown for correction) and exported as SVG, PNG, PDF or MIDI. Access is
  controlled per context by the tiny/sheetmusic:use capability. Requires
  local_sheetmusic, and filter_sheetmusic to display the saved scores.
